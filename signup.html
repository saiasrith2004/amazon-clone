<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    
    <div class="container">
        <form action="" id="signupForm">
            <h2>Create Account</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" name="" id="email" placeholder="Email" required>
            <input type="text " id="phone" placeholder="Phone Number" maxlength="10" required>
            <input type="date" name="" id="dob">
            <div class="input-group">
        <input type="password" id="signupPassword" placeholder="Password">
       <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('signupPassword', this)"></i>
       </div>
            <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
         <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
                </div>
                <div class="input-group">
    <label>Address</label>
    <textarea
        id="address"
        placeholder="Enter Address"
        required>
    </textarea>
</div>
                <button type="submit">Sign Up</button>
                <a href="login.html">Already have an account?</a>
        </form>
    </div>


    <script src="signup.js"></script>

</body>
</html>
