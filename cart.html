<!DOCTYPE html>
<html>
<head>
    <title>My Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <style>
    #checkoutMessage{
    color:red;
    font-weight:bold;
    text-align:center;
    margin:10px 0;
    font-size:18px;
}

.quantity-box{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:none !important;
    outline:none !important;
    background:#f0f2f2;
    border-radius:4px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:none !important;
}

.qty-btn:hover{
    background:#f0f2f2;
}

.qty-value{
    font-size:18px;
    font-weight:bold;
    min-width:20px;
    text-align:center;
}
    </style>
</head>
<body>

 <nav class="navbar">
        <div   class="logo">
        Amazon clone

        <span class="hamburger"
      onclick="toggleMenu()"
     >
    ☰
</span>
    </div>
        <div class="search-box">
            <input type="text" name="" id="searchInput" placeholder="Search Products">
            <button onclick="searchProducts()" id="b">  🔍</button>
        </div>
        <ul class="nav-links"  id="nav-links">
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </nav>
    

<h1>Shopping Cart</h1>

<table id="cartTable">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="cartBody"></tbody>
</table>
<div class="total-section">
<h2 id="totalPrice">Total: ₹0</h2>
</div>
<p id="message" style="color:red; text-align: center;"></p>
<div id="checkoutMessage"></div>

<button onclick="checkout()" class="checkout-btn" >
    Checkout
</button>




<script>
function toggleMenu(){
    let menu = document.getElementById("nav-links");

    console.log(menu);

    if(menu){
        menu.classList.toggle("show");
    }
}
</script>


<script src="cart.js"></script>

</body>
</html>
